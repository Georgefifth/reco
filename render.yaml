services:
  - type: web
    name: reco
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    pullRequestPreviewsEnabled: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
